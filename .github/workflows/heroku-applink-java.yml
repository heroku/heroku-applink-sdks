name: Java SDK

on:
  push:
    branches: [main]
    paths:
      - "heroku-applink-java/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-java.yml"
  pull_request:
    paths:
      - "heroku-applink-java/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-java.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["21", "25"]
    defaults:
      run:
        working-directory: heroku-applink-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          cache-dependency-path: heroku-applink-java/pom.xml
      - run: mvn --batch-mode verify
