name: Go SDK

on:
  push:
    branches: [main]
    paths:
      - "heroku-applink-go/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-go.yml"
  pull_request:
    paths:
      - "heroku-applink-go/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-go.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.27"]
    defaults:
      run:
        working-directory: heroku-applink-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
