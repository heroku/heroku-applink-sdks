name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - "heroku-applink-python/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-python.yml"
  pull_request:
    paths:
      - "heroku-applink-python/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-python.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: pub-hk-ubuntu-24.04-ip
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: heroku-applink-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: heroku-applink-python/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy src tests
      - run: uv run pytest
