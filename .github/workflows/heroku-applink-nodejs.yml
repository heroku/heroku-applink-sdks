name: Node.js SDK

on:
  push:
    branches: [main]
    paths:
      - "heroku-applink-nodejs/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-nodejs.yml"
  pull_request:
    paths:
      - "heroku-applink-nodejs/**"
      - "test-vectors/**"
      - ".github/workflows/heroku-applink-nodejs.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    defaults:
      run:
        working-directory: heroku-applink-nodejs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: heroku-applink-nodejs/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
