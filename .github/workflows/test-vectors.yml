name: Test vectors

on:
  push:
    branches: [main]
    paths:
      - "*.json"
      - "generate.py"
      - ".github/workflows/test-vectors.yml"
  pull_request:
    paths:
      - "*.json"
      - "generate.py"
      - ".github/workflows/test-vectors.yml"

permissions:
  contents: read

jobs:
  generated:
    runs-on: pub-hk-ubuntu-24.04-ip
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I generate.py
      - name: Check that the JSON files match generate.py
        run: |
          if [ -n "$(git status --porcelain -- ':(glob)*.json')" ]; then
            git status --short -- ':(glob)*.json'
            git diff -- ':(glob)*.json'
            echo "::error::The test vectors are out of date. Run python3 generate.py and commit the result."
            exit 1
          fi
