version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/heroku-applink-nodejs"
    schedule:
      interval: "monthly"
    groups:
      nodejs:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/heroku-applink-python"
    schedule:
      interval: "monthly"
    groups:
      python:
        update-types:
          - "minor"
          - "patch"

